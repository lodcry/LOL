workflows:
  ventory-android:
    name: Ventory Android Build
    max_build_duration: 120
    environment:
      unity: 2022.3.22f1
      vars:
        UNITY_EMAIL: $UNITY_EMAIL
        UNITY_PASSWORD: $UNITY_PASSWORD
    scripts:
      - name: Ativar Unity Personal online
        script: |
          arch -x86_64 $UNITY_HOME/Contents/MacOS/Unity \
            -batchmode \
            -logFile /dev/stdout \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" \
            -serial "" \
            -quit || true

      - name: Build APK Android
        script: |
          arch -x86_64 $UNITY_HOME/Contents/MacOS/Unity \
            -batchmode -quit \
            -logFile /dev/stdout \
            -projectPath . \
            -buildTarget Android \
            -executeMethod BuildScript.BuildAndroid \
            -nographics

    artifacts:
      - "*.apk"
