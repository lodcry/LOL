workflows:
  ventory-android:
    name: Ventory Android Build
    max_build_duration: 120
    environment:
      unity: 2022.3.22f1
    scripts:
      - name: Gerar arquivo de licenca
        script: |
          $UNITY_HOME/Contents/MacOS/Unity \
            -batchmode \
            -createManualActivationFile \
            -quit || true

          echo "=== Procurando .alf ==="
          find /Users /tmp /root /home -name "*.alf" 2>/dev/null

          ALF=$(find /Users /tmp /root /home -name "*.alf" 2>/dev/null | head -1)

          if [ -n "$ALF" ]; then
            echo "Encontrado: $ALF"
            cp "$ALF" "$CM_BUILD_DIR/Unity_activation.alf"
            echo "✅ Copiado para artifacts"
          else
            echo "❌ .alf nao encontrado"
          fi

    artifacts:
      - Unity_activation.alf
