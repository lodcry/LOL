workflows:
  ventory-android:
    name: Ventory Android Build
    max_build_duration: 120
    environment:
      unity: 2022.3.22f1
    scripts:
      - name: Ativar Unity Personal
        script: |
          $UNITY_HOME/Contents/MacOS/Unity \
            -batchmode \
            -logFile /dev/stdout \
            -createManualActivationFile \
            -quit || true
          
          cat Unity_v*.alf || echo "arquivo .alf gerado"

      - name: Build APK Android
        script: |
          $UNITY_HOME/Contents/MacOS/Unity \
            -batchmode -quit \
            -logFile /dev/stdout \
            -manualLicenseFile Unity_v*.ulc \
            -projectPath . \
            -buildTarget Android \
            -executeMethod BuildScript.BuildAndroid \
            -nographics
    artifacts:
      - "*.apk"
      - "*.alf"
