workflows:
  ventory-android:
    name: Ventory Android Build
    max_build_duration: 120
    environment:
      unity: 2022.3.22f1
    scripts:
      - name: Gerar arquivo de licenca
        script: |
          $UNITY_HOME/Contents/MacOS/Unity \
            -batchmode \
            -createManualActivationFile \
            -logFile /dev/stdout \
            -quit || true
          
          ls -la $CM_BUILD_DIR
          
          find / -name "*.alf" 2>/dev/null | head -5
          
          cp $(find / -name "*.alf" 2>/dev/null | head -1) $CM_BUILD_DIR/Unity_activation.alf || echo "nao encontrado"

    artifacts:
      - Unity_activation.alf
